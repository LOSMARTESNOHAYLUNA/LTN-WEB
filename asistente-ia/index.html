<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asistente IA de llamadas y WhatsApp — Lidera tu Negocio</title>
<meta name="description" content="Una recepcionista con IA que contesta las llamadas que tu equipo no puede atender, reserva citas y envía el resumen por WhatsApp. Pruébala ahora con el nombre de tu negocio.">
<meta name="robots" content="index,follow">
<link rel="icon" href="/img/LOGO-LTN-03-FAVICON.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Paleta de la web de Lidera tu Negocio (rosa #e61978, morado #3c2b86) con Poppins. */
:root{
  --bg:#f7f4ff;
  --surface:#ffffff;
  --surface-2:#ede8ff;
  --ink-band:#2b1e63;
  --line:rgba(60,43,134,.14);
  --line-2:rgba(60,43,134,.3);
  --fg:#1a0e3c;
  --muted:#5a4e7a;
  --purple:#3c2b86;
  --accent:#e61978;
  --accent-hi:#f52d88;
  --accent-text:#c8135f;
  --accent-soft:#fde6f0;
  --ok:#0f7a55;
  --ok-soft:#dcf3ea;
  --warn:#b4570a;
  --warn-soft:#fdeedd;
  --font:"Poppins","Segoe UI",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:72px}
h1,h2,h3{font-family:var(--font);line-height:1.12;margin:0;text-wrap:balance;color:inherit}
h1{font-size:clamp(2.1rem,5.4vw,3.8rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.65rem,3.8vw,2.6rem);font-weight:700;letter-spacing:-.015em;line-height:1.15}
h3{font-size:1.12rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-text);font-weight:700;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--accent)}
.lead{font-size:1.12rem;max-width:58ch;color:var(--muted)}
.center{text-align:center}
.center .lead,.center .eyebrow{margin-inline:auto;justify-content:center}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;font-weight:600;padding:15px 28px;border-radius:12px;text-decoration:none;border:0;font-family:var(--font);font-size:1rem;cursor:pointer;box-shadow:0 10px 30px -10px rgba(230,25,120,.6);transition:transform .15s,box-shadow .15s,background .15s;line-height:1.3}
.btn:hover{background:var(--accent-hi);transform:translateY(-2px);box-shadow:0 16px 36px -12px rgba(230,25,120,.7)}
.btn.ghost{background:var(--surface);color:var(--purple);border:1.5px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{padding:19px 36px;font-size:1.08rem}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.micro{font-size:.88rem;color:var(--muted);margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 14px}
.micro span::before{content:"✓ ";color:var(--ok);font-weight:800}

/* modo plantilla */
.editor{background:var(--warn-soft);border-bottom:1px solid #f0d2b0;font-size:.9rem}
.editor summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
.editor summary::-webkit-details-marker{display:none}
.editor summary::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--warn)}
.editor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding-bottom:16px}
.editor label{display:flex;flex-direction:column;gap:4px;font-weight:500;min-width:0}
.editor input,.editor select,.editor textarea{background:var(--surface);color:var(--fg);border:1px solid #e6c9a8;border-radius:6px;padding:9px 10px;font:inherit;min-width:0}
.editor textarea{min-height:64px;resize:vertical}
.editor .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-bottom:16px}
.editor .hint{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.editor .span2{grid-column:span 2}
@media (max-width:600px){.editor .span2{grid-column:span 1}}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(247,244,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-block:12px}
.top img{height:34px;width:auto;display:block}
.top .btn{padding:10px 18px;font-size:.9rem;box-shadow:none}
@media (max-width:600px){.top .btn{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:60px 80px}
.hero::before{content:"";position:absolute;right:-10%;bottom:-40%;width:60vw;max-width:720px;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(230,25,120,.14),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;top:-30%;left:-15%;width:50vw;max-width:600px;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(60,43,134,.16),transparent 70%);pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative}
.hero .wrap > *{min-width:0}
.hello{font-weight:600;font-size:clamp(1.05rem,2vw,1.35rem);color:var(--accent-text);margin-bottom:14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{margin-top:22px}
.offer{display:inline-flex;align-items:center;gap:10px;background:var(--ink-band);color:#fff;border-radius:999px;padding:7px 16px 7px 7px;font-weight:600;font-size:.92rem;margin-bottom:22px}
.offer b{background:var(--accent);color:#fff;border-radius:999px;padding:4px 10px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}

/* teléfono con llamada simulada */
.phone{background:var(--ink-band);color:#fff;border-radius:36px;padding:14px;max-width:400px;margin-inline:auto;box-shadow:0 40px 80px -30px rgba(43,30,99,.55);width:100%}
.screen{background:#3a2a7a;border-radius:26px;padding:22px 18px 18px;min-height:560px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;justify-content:space-between;font-size:.76rem;color:#fff}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5fe0a8;margin-right:6px;vertical-align:middle}
.caller{text-align:center;padding-block:6px}
.caller .av{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--accent),#7e57ff);display:grid;place-items:center;font-weight:700;font-size:1.6rem;color:#fff}
.caller b{display:block;font-size:1.1rem;color:#fff;font-weight:600}
.caller span{font-size:.84rem;color:#fff;font-variant-numeric:tabular-nums}
.msgs{display:flex;flex-direction:column;gap:9px;flex:1}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.45;overflow-wrap:anywhere;color:#fff}
.msg.bot{background:#4e3a9e;align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--accent);align-self:flex-end;border-bottom-right-radius:4px;font-weight:500}
.msg.sys{align-self:center;background:transparent;font-size:.76rem;color:#fff;border:1px dashed #7a66b8;border-radius:999px;padding:5px 12px}
.resumen{background:var(--ok-soft);color:#0b3d2b;border-radius:14px;padding:12px 14px;font-size:.86rem;line-height:1.5}
.resumen b{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.controls button{border:0;font:inherit;font-weight:600;border-radius:999px;padding:11px 20px;cursor:pointer;background:var(--accent);color:#fff}
.controls button.alt{background:#4e3a9e;color:#fff}
@media (prefers-reduced-motion:no-preference){
  .msg{animation:pop .3s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ring{animation:ring 1.2s infinite}
  @keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
}

/* banda de cifras */
.stats{background:var(--ink-band);color:#fff;padding-block:40px}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.stat{min-width:0;border-left:2px solid var(--accent);padding-left:16px}
.stat b{display:block;font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;color:#fff}

/* calculadora */
.calc{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;margin-top:36px}
.calc > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.ctrl{display:grid;gap:8px;margin-bottom:26px}
.ctrl:last-child{margin-bottom:0}
.ctrl-top{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.ctrl-top output{font-weight:700;color:var(--accent-text);font-variant-numeric:tabular-nums;font-size:1.1rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.results{display:grid;gap:14px}
.res{border-radius:16px;padding:20px 22px}
.res small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
.res b{display:block;font-weight:700;font-size:clamp(1.8rem,4.2vw,2.6rem);line-height:1.1;font-variant-numeric:tabular-nums}
.res span{font-size:.88rem;display:block;margin-top:6px}
.res.lose{background:var(--warn-soft);color:#6a3303}
.res.cost{background:var(--surface-2);color:var(--fg)}
.res.win{background:var(--ok-soft);color:#0b3d2b}
.res.win b{color:var(--ok)}
.roi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;border:1.5px dashed var(--line-2);border-radius:16px;font-weight:600}
.roi b{font-size:1.5rem;color:var(--accent-text)}
.note{font-size:.85rem;color:var(--muted);margin-top:16px}

/* pasos */
.steps{list-style:none;padding:0;margin:40px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;min-width:0}
.steps .n{font-weight:700;color:var(--accent-text);font-size:.82rem;letter-spacing:.1em;margin-bottom:14px;display:block}
.steps h3{margin-bottom:8px}
.steps p{color:var(--muted)}

/* comparativa */
.table{margin-top:36px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.trow{display:grid;grid-template-columns:1.1fr 1fr 1fr;border-top:1px solid var(--line)}
.trow:first-child{border-top:0;background:var(--surface-2);font-weight:600;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.trow > div{padding:18px 20px;min-width:0}
.trow .k{font-weight:600}
.trow .b{color:var(--warn)}
.trow .b::before{content:"✕ ";font-weight:800}
.trow .a{color:var(--ok);font-weight:500;background:var(--ok-soft)}
.trow .a::before{content:"✓ ";font-weight:800}
.trow:first-child .a::before,.trow:first-child .b::before{content:""}
@media (max-width:720px){
  .trow{grid-template-columns:1fr}
  .trow:first-child{display:none}
  .trow .k{padding-bottom:4px}
  .trow .b{padding-top:0}
}

/* prueba social */
.logos{display:flex;flex-wrap:wrap;gap:14px 36px;justify-content:center;align-items:center;margin-top:28px;font-weight:600;color:var(--muted);font-size:1.05rem}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:36px;text-align:left}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;min-width:0}
.quote p{font-size:1.02rem}
.quote footer{margin-top:16px;font-size:.88rem;color:var(--muted)}
.quote footer b{color:var(--fg)}

/* precio */
.pricing{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin-top:36px}
.pricing > *{min-width:0}
.pricecard{background:var(--ink-band);color:#fff;border-radius:24px;padding:34px}
.pricecard .tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:5px 12px;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
.pricecard .amount{font-weight:700;font-size:clamp(2.2rem,4.8vw,3.2rem);line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.pricecard .amount small{font-size:1rem;font-weight:500;color:#fff}
.pricecard ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;color:#fff}
.pricecard li::before{content:"✓ ";color:#5fe0a8;font-weight:800}
.pricecard .btn{margin-top:26px;width:100%}
.guar{display:grid;gap:14px}
.guar div{display:flex;gap:14px;align-items:flex-start}
.guar i{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-style:normal;font-weight:800}
.guar b{display:block;font-weight:600}
.guar span{color:var(--muted);font-size:.94rem}

/* faq */
.faq{margin-top:32px;max-width:760px}
details.q{border-top:1px solid var(--line);padding-block:18px}
details.q:last-of-type{border-bottom:1px solid var(--line)}
details.q summary{cursor:pointer;font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";color:var(--accent-text);font-weight:800;font-size:1.3rem;line-height:1}
details.q[open] summary::after{content:"–"}
details.q p{margin-top:10px;max-width:64ch;color:var(--muted)}

/* cierre */
.final{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border-radius:28px;padding:clamp(32px,7vw,72px);text-align:center}
.final h2{color:#fff;font-size:clamp(1.9rem,4.8vw,3.2rem)}
.final .lead{color:#fff;margin:16px auto 0}
.final .btn{background:#fff;color:var(--accent-text);box-shadow:0 14px 40px -12px rgba(0,0,0,.4)}
.final .btn:hover{background:#fff}
.final .micro{justify-content:center;color:#fff}
.final .micro span::before{color:#fff}
.contact{margin-top:22px;font-weight:600;overflow-wrap:anywhere;color:#fff}
footer.site{padding-block:32px 120px;font-size:.84rem;color:var(--muted)}
footer.site a{color:var(--muted)}

/* ── BOTONES FLOTANTES ── */
.fab-wrap{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;font:inherit;font-weight:600;font-size:.95rem;padding:14px 20px;border-radius:999px;cursor:pointer;box-shadow:0 14px 34px -10px rgba(230,25,120,.7);transition:transform .15s}
.fab:hover{transform:translateY(-2px)}
.fab .ico{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;font-size:.9rem}
.fab-menu{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.fab-menu button{display:inline-flex;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);font:inherit;font-weight:500;font-size:.9rem;padding:11px 16px;border-radius:999px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(43,30,99,.4)}
.fab-menu button:hover{border-color:var(--line-2);background:var(--surface-2)}
.fab-menu button .ico{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-size:.8rem}

/* panel del asistente */
.panel-ia{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;width:min(400px,calc(100vw - 32px));max-height:min(640px,calc(100vh - 36px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 70px -20px rgba(43,30,99,.5);display:flex;flex-direction:column;overflow:hidden}
.pi-head{background:var(--ink-band);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.pi-head .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7e57ff);display:grid;place-items:center;font-weight:700;flex:none}
.pi-head b{display:block;font-weight:600;line-height:1.2}
.pi-head small{font-size:.76rem;color:#fff}
.pi-head small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#5fe0a8;margin-right:6px}
.pi-close{margin-left:auto;background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px}
.pi-tabs{display:flex;border-bottom:1px solid var(--line)}
.pi-tabs button{flex:1;background:transparent;border:0;font:inherit;font-weight:500;font-size:.82rem;padding:10px 6px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.pi-tabs button[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent);font-weight:600}
.pi-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:260px;background:var(--bg)}
.pi-body .msg.bot{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.pi-body .msg.user{background:var(--accent);color:#fff}
.pi-body .msg.sys{color:var(--muted);border-color:var(--line-2)}
.typing{display:inline-flex;gap:4px;padding:10px 13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;align-self:flex-start}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.pi-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.pi-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 14px;font:inherit;font-size:.95rem;background:var(--bg);color:var(--fg)}
.pi-input button{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;border-radius:999px;padding:11px 16px;cursor:pointer}
.pi-form{padding:16px;display:grid;gap:12px;background:var(--bg);flex:1;overflow-y:auto}
.pi-form p{color:var(--muted);font-size:.92rem}
.pi-form label{display:grid;gap:4px;font-size:.85rem;font-weight:500}
.pi-form input,.pi-form select{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:var(--surface);color:var(--fg);min-width:0}
.pi-form .btn{width:100%}
.pi-ok{padding:24px 18px;text-align:center;display:grid;gap:12px;background:var(--bg);flex:1}
.pi-ok .big-ok{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:1.6rem;font-weight:800;margin:0 auto}
.pi-ok p{color:var(--muted);font-size:.92rem}
.pi-ok a.btn{font-size:.92rem}
.pi-foot{font-size:.7rem;color:var(--muted);text-align:center;padding:6px 10px 8px;background:var(--surface)}

@media (max-width:900px){
  .hero .wrap,.calc,.pricing{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .stats .wrap{grid-template-columns:1fr 1fr}
  section{padding-block:52px}
}
@media (max-width:480px){
  .fab span.txt{display:none}
  .fab{padding:14px}
}
</style>
</head>
<body>

<details class="editor" id="editor" open hidden>
  <summary class="wrap">Modo plantilla: personalizar esta página para otra empresa (pulsa para plegar o desplegar)</summary>
  <div class="wrap">
    <div class="editor-grid">
      <label>Empresa destinataria<input id="f-empresa" type="text"></label>
      <label>Sector<select id="f-sector"></select></label>
      <label>Nombre del asistente<input id="f-nombre" type="text" placeholder="Ej.: Marta"></label>

      <details class="q"><summary>¿Suena natural o parece un robot?</summary><p>Habla con voz natural, escucha interrupciones y adapta la conversación. Puedes probarlo ahora mismo con el botón de abajo a la derecha.</p></details>
      <details class="q"><summary>¿Qué pasa con las citas y los datos que recoge?</summary><p>Las citas se reservan en la agenda del equipo y cada llamada termina con un resumen por WhatsApp. Solo se guarda lo que la persona facilita durante la llamada, conforme al RGPD.</p></details>
      <details class="q"><summary>¿Puede pasar la llamada a una persona?</summary><p>Sí. Si alguien pide hablar con el equipo o la consulta lo requiere, ${N} toma nombre, teléfono y motivo, y avisa de inmediato para devolver la llamada.</p></details>
      <details class="q"><summary>¿Y si el volumen de llamadas crece?</summary><p>El asistente atiende varias llamadas a la vez, así que una campaña o una temporada alta no satura el teléfono.</p></details>
      <details class="q"><summary>¿Atiende también WhatsApp?</summary><p>Sí. El mismo asistente responde los mensajes de WhatsApp con las mismas respuestas y el mismo tono.</p></details>
    </div>
  </div></section>

  <section><div class="wrap">
    <div class="final">
      <h2>${N} ya puede contestar por ${E}.</h2>
      <p class="lead">Una demo corta para escuchar cómo atendería vuestras llamadas, con vuestros servicios y vuestro tono. Después, una propuesta con cifras claras.</p>
      <div class="cta-row" style="justify-content:center"><a class="btn big" href="${url}" target="_blank" rel="noopener">${cta}</a></div>
      <div class="micro"><span>Sin compromiso</span><span>Mismo número</span><span>Resumen en WhatsApp</span></div>
      ${cfg.contacto ? `<p class="contact">${esc(cfg.contacto)}</p>` : ""}
    </div>
  </div></section>
  <footer class="site"><div class="wrap">Propuesta preparada por <a href="https://lideratunegocio.com">Lidera tu Negocio</a> para ${E}. Las cifras de la calculadora son estimaciones a partir de los valores introducidos. · <a href="/privacidad/">Privacidad</a> · <a href="/aviso-legal/">Aviso legal</a></div></footer>`;

  bindCalc(coste); bindDemo(demo);
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openPanel(b.dataset.open));
}

function bindCalc(coste){
  const upd = () => {
    const l = +$("#c-llam").value, c = +$("#c-conv").value, t = +$("#c-tick").value;
    const miss = l * 22, cli = miss * c / 100, mes = cli * t;
    $("#o-llam").textContent = l; $("#o-conv").textContent = c + " %"; $("#o-tick").textContent = eur(t);
    $("#r-mes").textContent = eur(Math.round(mes));
    $("#r-anio").textContent = eur(Math.round(mes * 12)) + " al año · " + miss + " llamadas sin atender";
    if (coste) {
      $("#r-win").textContent = eur(Math.round(mes - coste));
      $("#r-cli").textContent = num(cli) + " clientes recuperados al mes";
      $("#r-roi").textContent = "×" + num(mes / coste);
    } else {
      $("#r-cli").textContent = num(cli);
    }
  };
  ["c-llam","c-conv","c-tick"].forEach(i => $("#" + i).addEventListener("input", upd)); upd();
}

let timers = [];
function bindDemo(demo){
  const box = $("#msgs"), btn = $("#play"), st = $("#state"), tm = $("#timer"), av = $("#av"), rs = $("#resumen");
  let secs = 0, tick = null;
  const add = m => { const d = document.createElement("div"); d.className = "msg " + m[0]; d.textContent = m[1]; box.appendChild(d); };
  const stop = () => { timers.forEach(clearTimeout); timers = []; clearInterval(tick); };
  const showAll = () => { box.innerHTML = ""; demo.forEach(add); st.textContent = "Llamada completada"; tm.textContent = "1:12"; av.classList.remove("ring"); rs.hidden = false; btn.textContent = "↻ Repetir la llamada"; };
  const run = () => {
    stop(); box.innerHTML = ""; rs.hidden = true; secs = 0; tm.textContent = "0:00";
    if (reduced) { showAll(); return; }
    st.textContent = "Conectando…"; av.classList.add("ring"); btn.textContent = "En llamada…";
    timers.push(setTimeout(() => { st.textContent = "En llamada"; tick = setInterval(() => { secs++; tm.textContent = Math.floor(secs/60) + ":" + String(secs%60).padStart(2,"0"); }, 1000); }, 900));
    demo.forEach((m, i) => timers.push(setTimeout(() => add(m), 900 + i * 1400)));
    timers.push(setTimeout(() => { clearInterval(tick); st.textContent = "Llamada completada"; av.classList.remove("ring"); rs.hidden = false; btn.textContent = "↻ Repetir la llamada"; }, 900 + demo.length * 1400));
  };
  showAll();
  btn.addEventListener("click", run);
}

/* ============ BOTONES FLOTANTES Y PANEL ============ */
const panel = $("#panel"), fabWrap = $("#fabWrap"), fabMenu = $("#fabMenu");
$("#fabMain").onclick = () => { fabMenu.hidden = !fabMenu.hidden; };
$("#pi-close").onclick = closePanel;
document.querySelectorAll("#fabMenu [data-open]").forEach(b => b.onclick = () => openPanel(b.dataset.open));
document.querySelectorAll(".pi-tabs [data-tab]").forEach(b => b.onclick = () => showTab(b.dataset.tab));

function openPanel(tab){ fabMenu.hidden = true; fabWrap.hidden = true; panel.hidden = false; showTab(tab || "chat"); if (tab === "chat" || !tab) startChat(); }
function closePanel(){ panel.hidden = true; fabWrap.hidden = false; }
function showTab(t){
  ["chat","llamada","whatsapp"].forEach(k => { $("#tab-" + k).hidden = k !== t; });
  $("#tab-ok").hidden = true;
  document.querySelectorAll(".pi-tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  if (t === "chat") { startChat(); setTimeout(() => $("#pi-in").focus(), 50); }
}

/* chat en vivo con el asistente (API /api/asistente) */
let history = [], chatStarted = false, busy = false;
const piMsgs = $("#pi-msgs");
function piAdd(role, text){ const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text; piMsgs.appendChild(d); piMsgs.scrollTop = piMsgs.scrollHeight; return d; }
function piResumen(line){
  const d = document.createElement("div"); d.className = "resumen";
  d.innerHTML = `<b>Resumen enviado al equipo por WhatsApp</b>${esc(line.replace(/\s*\|\s*/g, " · "))}`;
  piMsgs.appendChild(d); piMsgs.scrollTop = piMsgs.scrollHeight;
}
function startChat(){
  if (chatStarted) return; chatStarted = true;
  const s = sec();
  piAdd("sys", "Llamada entrante · " + (cfg.empresa || "tu negocio"));
  const hello = `Hola, has llamado a ${cfg.empresa || "tu negocio"}. Soy ${cfg.nombre || "Marta"}, la asistente del equipo. ${s.q1}`;
  piAdd("bot", hello); history.push({ role: "assistant", content: hello });
}
$("#pi-form").onsubmit = async e => {
  e.preventDefault();
  const inp = $("#pi-in"), text = inp.value.trim();
  if (!text || busy) return;
  inp.value = ""; busy = true;
  piAdd("user", text); history.push({ role: "user", content: text });
  const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>"; piMsgs.appendChild(t); piMsgs.scrollTop = piMsgs.scrollHeight;
  try {
    const r = await fetch("/api/asistente", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, empresa: cfg.empresa, sector: cfg.sector, nombre: cfg.nombre, servicio: sec().serv }) });
    const d = await r.json(); t.remove();
    let reply = (d.reply || "").trim();
    if (!reply) throw new Error(d.error || "sin respuesta");
    const m = reply.match(/\[RESUMEN\]\s*(.+)$/s);
    if (m) { reply = reply.replace(m[0], "").trim(); }
    if (reply) piAdd("bot", reply);
    if (m) piResumen(m[1].trim());
    history.push({ role: "assistant", content: d.reply });
  } catch (err) {
    t.remove();
    piAdd("sys", "Ahora mismo no puedo responder en directo. Prueba la llamada de ejemplo de arriba o pide que te llamen.");
  }
  busy = false;
};

/* formularios: que me llamen / que me escriban (API /api/lead) */
["llamada","whatsapp"].forEach(tipo => {
  $("#tab-" + tipo).onsubmit = async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector("button[type=submit]");
    const data = { tipo, nombre: f.nombre.value.trim(), telefono: f.telefono.value.trim(), horario: f.horario ? f.horario.value : "", empresa: cfg.empresa, sector: cfg.sector, pagina: location.href };
    btn.disabled = true; btn.textContent = "Enviando…";
    let ok = false;
    try { const r = await fetch("/api/lead", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }); ok = (await r.json()).ok === true; } catch (e2) { ok = false; }
    btn.disabled = false; btn.textContent = tipo === "llamada" ? "Que me llamen" : "Que me escriban";
    const N = cfg.nombre || "El asistente", E = cfg.empresa || "tu negocio";
    const wa = (cfg.whatsapp || "").replace(/\D/g, "");
    const waMsg = encodeURIComponent(`Hola, soy ${data.nombre}. Quiero probar el asistente de IA de ${E} (${tipo === "llamada" ? "que me llamen" : "que me escriban"}). Mi teléfono: ${data.telefono}`);
    const waLink = wa ? `https://api.whatsapp.com/send?phone=${wa}&text=${waMsg}` : "";
    $("#tab-ok").innerHTML = ok
      ? `<div class="big-ok">✓</div><h3>Recibido, ${esc(data.nombre)}</h3><p>${tipo === "llamada" ? `${esc(N)} te llama ${esc((data.horario || "en breve").toLowerCase())} al ${esc(data.telefono)}.` : `${esc(N)} te escribe en breve al ${esc(data.telefono)}.`}</p>${waLink ? `<a class="btn ghost" href="${waLink}" target="_blank" rel="noopener">Prefiero escribir yo por WhatsApp</a>` : ""}`
      : `<div class="big-ok">✓</div><h3>Casi, ${esc(data.nombre)}</h3><p>La petición no ha podido enviarse automáticamente. Escríbenos por WhatsApp y te atendemos al momento.</p>${waLink ? `<a class="btn" href="${waLink}" target="_blank" rel="noopener">Abrir WhatsApp</a>` : ""}`;
    ["chat","llamada","whatsapp"].forEach(k => $("#tab-" + k).hidden = true);
    $("#tab-ok").hidden = false;
    f.reset();
  };
});

/* ============ EDITOR DE PLANTILLA (?editor=1) ============ */
function initEditor(){
  if (!cfg.editor) return;
  $("#editor").hidden = false;
  const sel = $("#f-sector");
  Object.entries(SECTORES).forEach(([k, v]) => sel.add(new Option(v.n, k)));
  const map = {empresa:"f-empresa",sector:"f-sector",nombre:"f-nombre",ticket:"f-ticket",llamadas:"f-llamadas",conv:"f-conv",coste:"f-coste",cuota:"f-cuota",minuto:"f-minuto",wa:"f-wa",oferta:"f-oferta",url:"f-url",cta:"f-cta",contacto:"f-contacto",whatsapp:"f-whatsapp",logos:"f-logos",quotes:"f-quotes"};
  Object.entries(map).forEach(([k, id]) => {
    const el = $("#" + id); el.value = cfg[k] ?? "";
    if (k === "sector") el.value = cfg.sector;
    el.addEventListener("input", () => {
      cfg[k] = NUMERIC.includes(k) ? (el.value === "" ? null : +el.value) : el.value;
      if (k === "sector") { cfg.ticket = null; cfg.conv = null; $("#f-ticket").value = ""; $("#f-conv").value = ""; }
      chatStarted = false; history = []; piMsgs.innerHTML = "";
      render();
    });
  });
  $("#copy-link").addEventListener("click", async () => {
    const p = new URLSearchParams();
    PARAMS.forEach(k => { const v = cfg[k]; if (v !== null && v !== "" && v !== undefined && String(v) !== String(DEFAULTS[k])) p.set(k, v); });
    const link = location.origin + location.pathname + (p.toString() ? "?" + p.toString() : "");
    try { await navigator.clipboard.writeText(link); $("#copy-msg").textContent = "Enlace copiado: " + link; }
    catch (e) { $("#copy-msg").textContent = link; }
  });
}

initEditor(); render();
</script>
